name: agrisphere_360
description: A production-ready, scalable, enterprise-level Smart Agriculture application.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.9
  cloud_functions: ^4.5.9

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Location & Maps
  # Location & Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  http: ^1.2.0

  # AI & ML
  google_generative_ai: ^0.2.0

  # Utilities
  get_it: ^7.6.4
  intl: ^0.18.1
  cached_network_image: ^3.3.0
  image_picker: ^1.0.4
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2
  path_provider: ^2.1.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  flutter_dotenv: ^5.1.0
  logger: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - .env
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Medium.ttf
        - asset: assets/fonts/Outfit-Bold.ttf
